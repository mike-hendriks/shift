# Push a tag like v0.2.0 to build, sign and publish a release.
# Installed copies of Shift pick it up through the appcast in the latest release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build numbers and release notes come from the git history

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build, sign and publish
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # Fixed signing certificate, so macOS keeps file permissions across updates.
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" --publish
